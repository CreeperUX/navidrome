# The Sonus server's Docker image, ghcr.io/creeperux/navidrome: Navidrome frozen at 0.64.2 (SONUS.md), with Sonus
# Connect, two-step verification, API keys and the browser sign-in, and Sonus's look in the web UI. Built from the
# creeperux branch, for linux/amd64 and linux/arm64.
# Tags: latest, 0.64.2-sonus.<n> (n: the commits on this branch since 0.64.2, so every build counts up by itself), and
# sha-<commit>. The server reports the same version (Subsonic serverVersion, the web UI's About): clients that compare
# Navidrome versions keep seeing 0.64.2, the level of Navidrome this is.
# Every Monday it is built again with the newest Alpine packages (ffmpeg and the rest, their security fixes), whether or
# not the code changed; Unraid's daily update then picks that up.
name: "CreeperUX: Docker image"

on:
  push:
    branches:
      - creeperux
  schedule:
    - cron: "30 1 * * 1" # Mondays 01:30 UTC (scheduled runs use the default branch's workflow: creeperux)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: creeperux-image
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the upstream release this branch sits on, from its tags

      - name: Version
        id: version
        run: |
          frozen=v0.64.2 # the Navidrome release this fork is frozen at
          n=$(git rev-list --count "$frozen..HEAD")
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${frozen#v}-sonus.$n" >> "$GITHUB_OUTPUT"
          echo "git_tag=${frozen}-sonus.$n" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4 # the final stage's apk and mpv run as the target platform
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.version.outputs.image }}
          # the version first: it is what the image's version label says
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Sonus (Navidrome)
            org.opencontainers.image.description=The Sonus music server: Navidrome 0.64.2 with Sonus Connect, two-step verification and signing in through the browser

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true # the newest base images
          no-cache-filters: final # the runtime packages (apk add) fresh every build, not from the cache
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.version.outputs.git_sha }}
            GIT_TAG=${{ steps.version.outputs.git_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
