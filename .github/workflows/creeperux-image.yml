# The fork's own Docker image, ghcr.io/creeperux/navidrome: upstream Navidrome plus Sonus Connect (server/connect),
# built from the creeperux branch with upstream's Dockerfile, for linux/amd64 and linux/arm64.
# Tags: latest, <upstream version>-creeperux (0.64.2-creeperux), and sha-<commit>.
# Upstream's own workflows (pipeline.yml and the rest) run only for master, v* tags, pull requests and schedules, so
# they stay out of this branch; this fork never pushes v* tags.
name: "CreeperUX: Docker image"

on:
  push:
    branches:
      - creeperux
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: creeperux-image
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the upstream release this branch sits on, from its tags

      - name: Version
        id: version
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${base#v}-creeperux" >> "$GITHUB_OUTPUT"
          echo "git_tag=${base}-creeperux" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4 # the final stage's apk and mpv run as the target platform
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.version.outputs.image }}
          # the version first: it is what the image's version label says
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Navidrome (CreeperUX)
            org.opencontainers.image.description=Navidrome with Sonus Connect: a user's players see and control each other

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.version.outputs.git_sha }}
            GIT_TAG=${{ steps.version.outputs.git_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
